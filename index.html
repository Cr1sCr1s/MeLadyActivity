<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Date Request ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: #141414;
            padding: 30px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #222;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 25px;
            font-weight: 600;
            color: #f1f1f1;
            width: 100%;
            text-align: center;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            position: relative;
            min-height: 50px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #yesBtn {
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #000;
            flex: 1;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            width: 100%;
        }

        #noBtn {
            background-color: #222;
            color: #aaa;
            flex: 1;
            position: relative;
        }

        .activity-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            width: 100%;
            margin-bottom: 20px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 2px;
        }

        .activity-card {
            background: #1c1c1e;
            border: 2px solid #2c2c2e;
            padding: 12px 15px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .activity-card.selected {
            border-color: #d4af37;
            background: #25231c;
        }

        .activity-card span {
            font-size: 22px;
        }

        .activity-card p {
            font-size: 14px;
            color: #fff;
            font-weight: 500;
        }

        .input-group {
            width: 100%;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .custom-input {
            width: 100%;
            padding: 14px 16px;
            background: #1c1c1e;
            border: 2px solid #2c2c2e;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            text-align: center;
        }

        .custom-input:focus {
            border-color: #d4af37;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h1 id="mainTitle">Do you want to go on a date with me? ❤️</h1>
        <div class="btn-group" id="btnGroup">
            <button id="yesBtn" onclick="nextStep(1)">Yes</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <script>
        // Trage hier deine Handynummer ein (z.B. 491701234567 ohne + und 0)
        const phoneNumber = "4915157810000";

        let selectedActivity = "";

        const messages = [
            "Are you sure? 🥺",
            "Think again! 💭",
            "Wrong button! ❌",
            "Not an option! 😉",
            "Try the other one! ❤️"
        ];
        let msgIndex = 0;

        function moveButton() {
            const noBtn = document.getElementById("noBtn");
            noBtn.innerText = messages[msgIndex];
            msgIndex = (msgIndex + 1) % messages.length;

            const x = (Math.random() - 0.5) * 140;
            const y = (Math.random() - 0.5) * 140;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }

        function nextStep(step) {
            const container = document.getElementById("mainContainer");

            if (step === 1) {
                container.innerHTML = `
                    <h1>What are you in the mood for? ✨</h1>
                    <div class="activity-grid">
                        <div class="activity-card" onclick="selectActivity(this, 'Fine Dining 🍷')">
                            <span>🍷</span>
                            <p>Fine Dining</p>
                        </div>
                        <div class="activity-card" onclick="selectActivity(this, 'Cinema 🍿')">
                            <span>🍿</span>
                            <p>Cinema</p>
                        </div>
                        <div class="activity-card" onclick="selectActivity(this, 'Shopping 🛍️')">
                            <span>🛍️</span>
                            <p>Shopping</p>
                        </div>
                        <div class="activity-card" onclick="selectActivity(this, 'Getaway / Day Trip 🏙️')">
                            <span>🏙️</span>
                            <p>Getaway / Day Trip</p>
                        </div>
                        <div class="activity-card" onclick="selectActivity(this, 'Night Drive & Snacks 🚗')">
                            <span>🚗</span>
                            <p>Night Drive & Snacks</p>
                        </div>
                        <div class="activity-card" onclick="selectActivity(this, 'custom')">
                            <span>💡</span>
                            <p>Your own idea</p>
                        </div>
                    </div>
                    <div id="customInputWrapper" class="input-group hidden" style="width: 100%;">
                        <input type="text" id="customActivityInput" class="custom-input" placeholder="Type your idea here...">
                    </div>
                    <button id="yesBtn" class="hidden" onclick="proceedToDateTime()">Next ➡️</button>
                `;
            } else if (step === 2) {
                container.innerHTML = `
                    <h1>When are you free? 🗓️</h1>
                    <div class="input-group">
                        <input type="date" id="dateInput" class="custom-input">
                        <input type="time" id="timeInput" class="custom-input">
                    </div>
                    <button id="yesBtn" onclick="sendWhatsApp()">Send 💌</button>
                `;
            }
        }

        function selectActivity(element, activity) {
            document.querySelectorAll('.activity-card').forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');
            
            const customWrapper = document.getElementById('customInputWrapper');
            const nextButton = document.getElementById('yesBtn');

            if (activity === 'custom') {
                selectedActivity = "";
                customWrapper.classList.remove('hidden');
                nextButton.classList.remove('hidden');
                document.getElementById('customActivityInput').focus();
            } else {
                selectedActivity = activity;
                customWrapper.classList.add('hidden');
                nextButton.classList.remove('hidden');
            }
        }

        function proceedToDateTime() {
            const customInput = document.getElementById('customActivityInput');
            if (!selectedActivity && customInput && customInput.value.trim() !== "") {
                selectedActivity = customInput.value.trim();
            }

            if (!selectedActivity) {
                alert("Please select or type an activity! ❤️");
                return;
            }

            nextStep(2);
        }

        function sendWhatsApp() {
            const dateVal = document.getElementById('dateInput').value;
            const timeVal = document.getElementById('timeInput').value;

            if (!dateVal || !timeVal) {
                alert("Please select both a date and a time! ❤️");
                return;
            }

            const text = encodeURIComponent(`I'm so excited! 🥰\nActivity: ${selectedActivity}\nDate: ${dateVal}\nTime: ${timeVal}`);
            window.location.href = `https://wa.me/${phoneNumber}?text=${text}`;
        }
    </script>
</body>
</html>
