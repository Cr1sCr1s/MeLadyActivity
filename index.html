<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Date Anfrage</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #121212 0%, #1f1f1f 100%);
            color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
            overflow: hidden;
        }
        .card {
            background: rgba(28, 28, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
            position: relative;
            backdrop-filter: blur(10px);
        }
        h1, h2 { 
            color: #ffffff; 
            font-size: 21px; 
            margin-bottom: 25px; 
            line-height: 1.4;
            font-weight: 600;
        }
        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            min-height: 80px;
            position: relative;
        }
        button {
            padding: 14px 28px;
            font-size: 17px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.2s ease;
        }
        .btn-yes { 
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            color: #ffffff; 
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            z-index: 10;
        }
        .btn-yes:active {
            transform: scale(0.96);
        }
        .btn-no { 
            background-color: #2c2c2e; 
            color: #8e8e93; 
            border: 1px solid rgba(255,255,255,0.1);
            position: fixed; 
            transition: all 0.15s ease-out;
            z-index: 999;
        }
        .hidden { display: none; }
        input[type="date"], input[type="time"], input[type="text"] {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            background: #2c2c2e;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #d4af37;
        }
        .activity-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .activity-card {
            background: #2c2c2e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 16px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 16px;
            color: #f5f5f7;
            text-align: left;
            transition: all 0.2s;
        }
        .activity-card.selected {
            border-color: #d4af37;
            background: rgba(212, 175, 55, 0.12);
            font-weight: 600;
        }
        #customInputWrapper {
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- Schritt 1: Frage -->
    <div id="step1">
        <h1>Me Lady 🤍🐿️<br>would you like to go on a date with me?! 👫🏻💕</h1>
        <div class="buttons">
            <button class="btn-yes" onclick="nextStep(2)">JA</button>
            <button class="btn-no" id="noBtn" ontouchstart="teleportButton(event)" onmouseover="teleportButton(event)" onclick="teleportButton(event)">Nein</button>
        </div>
    </div>

    <!-- Schritt 2: Datum & Uhrzeit -->
    <div id="step2" class="hidden">
        <h2>Wann hast du Zeit? 🗓️</h2>
        <input type="date" id="dateInput"><br>
        <input type="time" id="timeInput"><br><br>
        <button class="btn-yes" style="width: 100%;" onclick="nextStep(3)">Weiter ➡️</button>
    </div>

    <!-- Schritt 3: Aktivitäten -->
    <div id="step3" class="hidden">
        <h2>Worauf hast du Lust? ✨</h2>
        <div class="activity-options">
            <div class="activity-card" onclick="selectActivity('Fine Dining', this)">🍷 Fine Dining</div>
            <div class="activity-card" onclick="selectActivity('Cinema', this)">🍿 Cinema</div>
            <div class="activity-card" onclick="selectActivity('Shopping', this)">🛍️ Shopping</div>
            <div class="activity-card" onclick="selectActivity('Getaway / Day Trip', this)">🚗 Getaway / Day Trip</div>
            <div class="activity-card" onclick="selectActivity('Night Drive & Snacks', this)">🌃 Night Drive & Snacks</div>
            <div class="activity-card" onclick="selectActivity('Custom Idea', this)" id="customCard">💡 Eigener Vorschlag</div>
        </div>
        
        <div id="customInputWrapper">
            <input type="text" id="customTextInput" placeholder="Schreib deinen Vorschlag hier...">
        </div>

        <br>
        <button class="btn-yes" style="width: 100%;" onclick="sendWhatsApp()">Abschicken 💌</button>
    </div>
</div>

<script>
    let selectedActivity = '';

    function teleportButton(e) {
        if(e) e.preventDefault();
        const btn = document.getElementById('noBtn');
        
        const padding = 20;
        const maxX = window.innerWidth - btn.offsetWidth - padding;
        const maxY = window.innerHeight - btn.offsetHeight - padding;
        
        const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
        const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
        
        btn.style.left = `${randomX}px`;
        btn.style.top = `${randomY}px`;
    }

    function nextStep(step) {
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.add('hidden');
        document.getElementById('step3').classList.add('hidden');
        document.getElementById(`step${step}`).classList.remove('hidden');
    }

    function selectActivity(activity, element) {
        selectedActivity = activity;
        document.querySelectorAll('.activity-card').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');

        const customWrapper = document.getElementById('customInputWrapper');
        if (activity === 'Custom Idea') {
            customWrapper.style.display = 'block';
        } else {
            customWrapper.style.display = 'none';
        }
    }

    function sendWhatsApp() {
        const date = document.getElementById('dateInput').value;
        const time = document.getElementById('timeInput').value;
        
        if (selectedActivity === 'Custom Idea') {
            const customText = document.getElementById('customTextInput').value;
            if (customText) {
                selectedActivity = `Eigener Vorschlag: ${customText}`;
            }
        }
        
        // Trage hier deine Handynummer im internationalen Format ein (z. B. 491701234567)
        const phoneNumber = "491515780000"; 
        
        const text = `Ich möchte sehr gerne mit dir ein Date! ❤️%0A📅 Datum: ${date}%0A⏰ Uhrzeit: ${time}%0A🎯 Aktivität: ${selectedActivity}`;
        
        window.location.href = `https://wa.me/${phoneNumber}?text=${text}`;
    }
</script>

</body>
</html>
